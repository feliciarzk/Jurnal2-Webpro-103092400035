<!DOCTYPE html>
<html>
<head>
    <title>Tabel Biru dan Hijau</title>
</head>

<body>

<table width="400" height="560" border="1" bordercolor="white" cellspacing="0">

    <!-- BARIS 1 -->
    <tr height="80">
        <td width="80" rowspan="7" bgcolor="blue"></td>
        <td width="80" colspan="3" bgcolor="blue"></td>
        <td width="80"></td>
    </tr>

    <!-- BARIS 2 -->
    <tr height="80">
        <td width="80" bgcolor="lime"></td>
        <td width="80" colspan="2" rowspan="2" bgcolor="lime"></td>
        <td width="80" rowspan="2" bgcolor="blue"></td>
    </tr>

    <!-- BARIS 3 -->
    <tr height="80">
        <td width="80"></td>
    </tr>

    <!-- BARIS 4 -->
    <tr height="80">
        <td width="80" bgcolor="blue"></td>
        <td width="80"></td>
        <td width="80" bgcolor="blue"></td>
        <td width="80"></td>
    </tr>

    <!-- BARIS 5 -->
    <tr height="80">
        <td></td>
        <td></td>
        <td></td>
        <td></td>
    </tr>

    <!-- BARIS 6 -->
    <tr height="80">
        <td></td>
        <td></td>
        <td></td>
        <td></td>
    </tr>

    <!-- BARIS 7 -->
    <tr height="80">
        <td></td>
        <td></td>
        <td></td>
        <td></td>
    </tr>

</table>

</body>
</html>
