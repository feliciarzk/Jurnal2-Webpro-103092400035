<!DOCTYPE html>
<html>
<head>
    <title>Data Mahasiswa</title>
</head>

<body>

<h2>Data Mahasiswa</h2>

<form onsubmit="return validasiHobi()">

    <table>

        <tr>
            <td>NIM</td>
            <td>:</td>
            <td>
                <input type="text" name="nim" required>
            </td>
        </tr>

        <tr>
            <td>Nama</td>
            <td>:</td>
            <td>
                <input type="text" name="nama" required>
            </td>
        </tr>

        <tr>
            <td>Tgl Lahir (dd-mm-yyyy)</td>
            <td>:</td>
            <td>
                <input type="date" name="tanggal_lahir" required>
            </td>
        </tr>

        <tr>
            <td>Jenis Kelamin</td>
            <td>:</td>
            <td>
                <input type="radio" name="jenis_kelamin" value="Laki-Laki" required>
                Laki-Laki

                <input type="radio" name="jenis_kelamin" value="Perempuan">
                Perempuan
            </td>
        </tr>

        <tr>
            <td valign="top">Alamat di Surabaya</td>
            <td valign="top">:</td>
            <td>
                <textarea name="alamat" rows="4" cols="30"></textarea>
            </td>
        </tr>

        <tr>
            <td valign="top">Tinggal di</td>
            <td valign="top">:</td>
            <td>
                <select name="tinggal" required>
                    <option value="">--pilih--</option>
                    <option value="Kos/Kontrakan">Kos/Kontrakan</option>
                    <option value="Rumah saudara">Rumah saudara</option>
                    <option value="Rumah orang tua">Rumah orang tua</option>
                </select>
            </td>
        </tr>

        <tr>
            <td valign="top">Hobi</td>
            <td valign="top">:</td>
            <td>
                <input type="checkbox" name="hobi" value="Science">
                Science<br>

                <input type="checkbox" name="hobi" value="Technology">
                Technology<br>

                <input type="checkbox" name="hobi" value="Art">
                Art<br>

                <input type="checkbox" name="hobi" value="Sport">
                Sport
            </td>
        </tr>

        <tr>
            <td></td>
            <td></td>
            <td>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </td>
        </tr>

    </table>

</form>


<script>
function validasiHobi() {

    let hobi = document.querySelectorAll(
        'input[name="hobi"]:checked'
    );

    if (hobi.length !== 2) {
        alert("Silakan pilih tepat 2 hobi.");
        return false;
    }

    return true;
}
</script>

</body>
</html>
